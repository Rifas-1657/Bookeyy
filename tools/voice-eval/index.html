<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bookey Voice Test</title>
<style>
  :root { --bg:#f5efe3; --card:#fbf7ef; --ink:#17130e; --muted:#64584a; --gold:#8a6322; --line:#e4d6b8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e0c0a; --card:#1b1712; --ink:#f3ead8; --muted:#b3a68e; --gold:#d4ae66; --line:#3a2f1c; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, sans-serif; }
  header { position:sticky; top:0; z-index:2; background:var(--bg); border-bottom:1px solid var(--line); padding:12px 16px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  h1 { font-size:18px; margin:0 12px 0 0; }
  main { max-width:960px; margin:0 auto; padding:16px; }
  button, select { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; padding:6px 10px; cursor:pointer; }
  button.primary { background:var(--gold); color:var(--bg); border-color:var(--gold); }
  .item { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin:14px 0; }
  .text { font-size:16px; font-style:italic; }
  .meta { color:var(--muted); font-size:12px; margin:4px 0 10px; word-break:break-word; }
  .group { margin-top:10px; }
  .group h3 { margin:6px 0; font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--gold); }
  .clip { display:grid; grid-template-columns: 34px 1fr auto; gap:8px; align-items:center; padding:6px 0; border-top:1px dashed var(--line); }
  .clip b { font-size:16px; }
  audio { width:100%; height:34px; }
  .stars { display:flex; gap:2px; }
  .stars button { padding:2px 7px; }
  .stars button.on { background:var(--gold); color:var(--bg); }
  .name { grid-column: 2 / 4; font-size:12px; color:var(--muted); }
  table { width:100%; border-collapse:collapse; margin-top:10px; }
  th, td { text-align:left; padding:6px; border-bottom:1px solid var(--line); }
  .hint { color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Bookey Voice Test</h1>
  <select id="lang"><option value="tanglish">Tanglish</option><option value="english">English</option></select>
  <button id="reveal">Reveal names</button>
  <button id="summary" class="primary">Scores</button>
  <button id="export">Export JSON</button>
  <span class="hint">Rate each clip 1–5: natural + correct pronunciation. Saved in this browser.</span>
</header>
<main id="app"><p class="hint">Loading… run <code>python -m http.server 8090</code> in <code>tools/voice-eval</code> and open http://localhost:8090.</p></main>
<script>
const KEY = 'bookey-voice-eval:v1'
let data, reveal = false
let ratings = {}
try { ratings = JSON.parse(localStorage.getItem(KEY) || '{}') } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(ratings)) } catch {} }

// Stable per-item shuffle so labels don't move between reloads.
function shuffled(arr, seed) {
  const a = [...arr]; let s = [...seed].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7)
  for (let i = a.length - 1; i > 0; i--) { s = (s * 1103515245 + 12345) >>> 0; const j = s % (i + 1); [a[i], a[j]] = [a[j], a[i]] }
  return a
}

function render() {
  const lang = document.getElementById('lang').value
  const app = document.getElementById('app')
  app.innerHTML = ''
  for (const [id, it] of Object.entries(data.items)) {
    if (it.lang !== lang || !it.clips) continue
    const box = document.createElement('section'); box.className = 'item'
    box.innerHTML = `<div class="text">${it.text}</div><div class="meta">Engine input: ${it.engineText}</div>`
    for (const gender of ['male', 'female']) {
      const engines = shuffled(Object.keys(it.clips).filter((e) => data.engines[e]?.gender === gender), id + gender)
      if (!engines.length) continue
      const g = document.createElement('div'); g.className = 'group'; g.innerHTML = `<h3>${gender}</h3>`
      engines.forEach((eid, i) => {
        const clip = it.clips[eid], label = String.fromCharCode(65 + i)
        const row = document.createElement('div'); row.className = 'clip'
        row.innerHTML = `<b>${label}</b><audio controls preload="none" src="${clip.file}"></audio><div class="stars"></div>`
        const stars = row.querySelector('.stars')
        for (let n = 1; n <= 5; n++) {
          const b = document.createElement('button'); b.textContent = n
          if ((ratings[id]?.[eid]) === n) b.classList.add('on')
          b.onclick = () => { (ratings[id] ||= {})[eid] = n; save(); render() }
          stars.appendChild(b)
        }
        if (reveal) { const nm = document.createElement('div'); nm.className = 'name'; nm.textContent = `${eid} · ${data.engines[eid].local ? 'local' : 'online'} · rtf ${clip.rtf}`; row.appendChild(nm) }
        g.appendChild(row)
      })
      box.appendChild(g)
    }
    app.appendChild(box)
  }
}

function summary() {
  const rows = Object.entries(data.engines).map(([eid, e]) => {
    const scores = Object.values(ratings).map((r) => r[eid]).filter(Boolean)
    const avg = scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : 0
    return { eid, ...e, avg, n: scores.length }
  }).sort((a, b) => b.avg - a.avg)
  document.getElementById('app').innerHTML = `<section class="item"><h2>Scores</h2><table><tr><th>Engine</th><th>Voice</th><th>Lang</th><th>Runs</th><th>Avg</th><th>Rated</th></tr>${rows.map((r) => `<tr><td>${r.eid}</td><td>${r.gender}</td><td>${r.langs.join(', ')}</td><td>${r.local ? 'local' : 'online'}</td><td>${r.avg ? r.avg.toFixed(2) : '—'}</td><td>${r.n}</td></tr>`).join('')}</table><p><button onclick="render()">Back to clips</button></p></section>`
}

document.getElementById('lang').onchange = render
document.getElementById('reveal').onclick = () => { reveal = !reveal; render() }
document.getElementById('summary').onclick = summary
document.getElementById('export').onclick = () => {
  const blob = new Blob([JSON.stringify({ ratings, engines: data.engines }, null, 1)], { type: 'application/json' })
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'bookey-voice-ratings.json'; a.click()
}
fetch('out/tts/results.json').then((r) => r.json()).then((d) => { data = d; render() })
  .catch(() => {})
</script>
</body>
</html>
